<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>UniSwap Automated Test Runner</title>
</head>
<body>
  <h1>Test Suite Results</h1>
  <pre id="output">Running...</pre>

  <script type="module">
    import { Store } from './js/store.js';
    import { runStoreTests } from './tests/store.test.js';
    import { filterItems } from './js/filter-engine.js';
    import { runFilterTests } from './tests/filter.test.js';
    import { AIEngine } from './js/ai-engine.js';
    import { runAITests } from './tests/ai.test.js';

    let allResults = [];
    const storeResults = runStoreTests(Store);
    allResults = allResults.concat(storeResults);

    const items = Store.getItems();
    const filterResults = runFilterTests(filterItems, items);
    allResults = allResults.concat(filterResults);

    const aiResults = runAITests(AIEngine, items);
    allResults = allResults.concat(aiResults);

    const output = document.getElementById('output');
    output.textContent = JSON.stringify(allResults, null, 2);
    console.log('TEST_RESULTS_READY', JSON.stringify(allResults));
  </script>
</body>
</html>
